<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ 'Einrichtung' if setup else 'Anmelden' }} · RentFlow</title><link rel="stylesheet" href="/static/app.css"></head><body class="auth"><div class="auth-wrap"><a class="brand" href="/"><span class="brandmark">R</span>RentFlow</a><h1>{{ 'Willkommen bei RentFlow' if setup else 'Schnnnnnn, dass du da bist.' }}</h1><p class="muted">{{ 'Richte deinen Verleih ein. Danach kann es losgehen.' if setup else 'Melde dich an und behalte deine Aufträge im Blick.' }}</p><form method="post"><input type="hidden" name="csrf" value="{{ csrf }}">{% if setup %}<label>Einrichtungsschlüssel<input name="token" required autocomplete="off"></label><div class="grid2"><label>Dein Name<input name="name" required></label><label>Firmenname<input name="company" required></label></div><label>Firmenanschrift<textarea name="address" required></textarea></label><div class="grid2"><label>Steuernummer / USt-IdNr.<input name="tax_id"></label><label>IBAN<input name="iban"></label></div><label>Besteuerung<select name="tax_mode"><option value="regular">Regelbesteuerung</option><option value="small">Kleinunternehmer (§ 19 UStG)</option></select></label>{% endif %}<label>E-Mail-Adresse<input type="email" name="email" required autocomplete="username"></label><label>Passwort<input type="password" name="password" minlength="{{ 12 if setup else 1 }}" required autocomplete="{{ 'new-password' if setup else 'current-password' }}"></label><button class="primary wide">{{ 'RentFlow einrichten' if setup else 'Anmelden' }} →</button></form></div></body></html>
